name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore backend and reject high or critical NuGet advisories
        run: dotnet restore src/AiTrustCalibration.Api/AiTrustCalibration.Api.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all "-p:WarningsAsErrors=NU1903;NU1904"
      - name: Build backend
        run: dotnet build src/AiTrustCalibration.Api/AiTrustCalibration.Api.csproj --configuration Release --no-restore

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject high or critical npm advisories
        run: npm audit --audit-level=high
      - name: Verify npm registry signatures and provenance
        run: npm audit signatures
      - name: Build frontend
        run: npm run build
